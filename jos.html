<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teaching Whiteboard</title>
<style>
:root{--bg:#f4f5f7;--panel:#ffffff;--ink:#1f2430;--mute:#667085;--line:#d6d9e0;--acc:#1971c2;--accbg:#dbeafe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--panel:#1c1f26;--ink:#e7e9ee;--mute:#9aa1ad;--line:#2f343d;--acc:#74b0f5;--accbg:#22364f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--panel:#1c1f26;--ink:#e7e9ee;--mute:#9aa1ad;--line:#2f343d;--acc:#74b0f5;--accbg:#22364f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;overscroll-behavior:none;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;min-height:34px;white-space:nowrap}
button:hover{background:var(--accbg)}
button.on{background:var(--accbg);border-color:var(--acc);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.grp{display:flex;gap:4px;align-items:center}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.sw{width:26px;height:26px;min-height:26px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}
input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
input[type=range]{width:90px}
select{min-height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:4px 6px}
#board{flex:1;position:relative;min-height:0;overflow:hidden;--g:rgba(0,0,0,.09)}
#board[data-bg="white"]{background-color:#fff}
#board[data-bg="green"]{background-color:#1f4d3a;--g:rgba(255,255,255,.12)}
#board[data-bg="black"]{background-color:#15171a;--g:rgba(255,255,255,.12)}
#board.grid{background-image:linear-gradient(var(--g) 1px,transparent 1px),linear-gradient(90deg,var(--g) 1px,transparent 1px)}
canvas{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.morebtn{display:none}
#ov{cursor:crosshair}
.foot{padding:5px 12px;color:var(--mute);font-size:12.5px;background:var(--panel);border-top:1px solid var(--line)}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#20242c;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;max-width:90%}
#toast.show{opacity:1}
#calc{position:absolute;right:12px;bottom:12px;width:244px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.28);padding:8px;z-index:5;user-select:none;-webkit-user-select:none}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:600;cursor:move;padding:2px 2px 6px;touch-action:none}
#ci{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:16px ui-monospace,Menlo,Consolas,monospace}
#cr{text-align:right;min-height:30px;font:600 20px ui-monospace,Menlo,Consolas,monospace;padding:4px 2px;overflow:hidden}
.ck{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ck button{padding:6px 0;min-height:34px}
@media(max-width:1100px){.morebtn{display:inline-block}.bar .sec,.bar .sep{display:none}.bar.open .sec{display:flex;flex-wrap:wrap}.bar{max-height:62vh;overflow-y:auto;gap:6px 8px}.foot{display:none}#tools{flex:1 1 100%;overflow-x:auto;-webkit-overflow-scrolling:touch}#tools button{padding:4px 9px}}
@media(max-width:560px){#calc{width:min(244px,calc(100% - 16px));right:8px;bottom:8px}#toast{font-size:13px}}
@media(pointer:coarse){button,select{min-height:44px}select,input{font-size:16px}.sw{width:36px;height:36px;min-height:36px}input[type=color]{width:44px;height:44px}input[type=range]{width:120px}.dots button{min-height:0}}
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Whiteboard tools">
 <div class="grp" id="tools">
  <button data-t="pen" class="on">Pen</button><button data-t="er">Eraser</button><button data-t="line">Line</button><button data-t="rect">Rectangle</button><button data-t="ell">Ellipse</button><button data-t="fill">Fill color</button><button data-t="sel">Select photo or file</button><button data-t="hand">Move canvas</button>
 </div>
 <select id="pt" aria-label="Pen type"><option value="pen">Ball pen</option><option value="pencil">Pencil</option><option value="marker">Marker</option><option value="brush">Brush</option><option value="hl">Highlighter</option><option value="chalk">Chalk</option></select>
 <span class="sep"></span>
 <div class="grp" id="sw"></div>
 <input type="color" id="col" value="#1f2430" aria-label="Custom color" title="Custom color">
 <label class="grp" title="Pen size">Size <input type="range" id="size" min="1" max="24" value="4"></label>
 <span class="sep"></span>
 <div class="grp sec">
  <button id="snap" class="on" aria-pressed="true" title="Rough lines, circles, triangles and rectangles snap to clean shapes">Auto-correct</button>
  <button id="fillt" aria-pressed="false" title="Shapes get a translucent fill">Fill shapes</button>
  <button id="comp" aria-pressed="false">Compass</button>
  <button id="rul" aria-pressed="false">Ruler</button>
  <button id="pro" aria-pressed="false">Protractor</button>
  <button id="calcb" aria-pressed="false">Calculator</button>
  <button id="grid" aria-pressed="false">Grid</button>
  <select id="bg" aria-label="Board color"><option value="white">White board</option><option value="green">Green board</option><option value="black">Black board</option></select>
 </div>
 <span class="sep"></span>
 <div class="grp sec"><button id="addp" title="Add a photo (you can also paste or drop one)">Add photo</button><button id="attach" title="Attach a PowerPoint, PDF or any file">Attach file</button><button id="rm">Remove selected</button><button id="sb">Save board</button><button id="ob">Open board</button><button id="sp">Save picture</button><input type="file" id="fp" accept="image/*" multiple hidden><input type="file" id="fa" multiple hidden><input type="file" id="fo" accept=".json,application/json" hidden></div>
 <span class="sep"></span>
 <div class="grp sec"><button id="zo" aria-label="Zoom out">−</button><button id="zl" title="Reset zoom">100%</button><button id="zi" aria-label="Zoom in">+</button></div>
 <span class="sep"></span>
 <div class="grp"><button id="undo">Undo</button><button id="redo">Redo</button><button id="more" class="morebtn" aria-expanded="false">More tools</button></div><div class="grp sec"><button id="clear">Clear board</button></div>
</div>
<div id="board" data-bg="white">
 <canvas id="img"></canvas><canvas id="main"></canvas><canvas id="ov" aria-label="Drawing area"></canvas>
 <div id="toast" role="status"></div>
 <div id="calc" hidden>
  <div class="ch" id="ch"><span>Calculator</span><button id="cc" aria-label="Close calculator">×</button></div>
  <input id="ci" autocomplete="off" inputmode="none" aria-label="Expression" placeholder="Type or tap keys">
  <div id="cr" aria-live="polite"></div>
  <div class="ck" id="ck"></div>
 </div>
</div>
<div class="foot">The board is endless: scroll or drag with two fingers to move, Ctrl + scroll or pinch to zoom. Paste or drop photos and files onto the board. Compass: drag the needle to move it, the blue knob to open or close it, the pencil tip to draw an arc.</div>
